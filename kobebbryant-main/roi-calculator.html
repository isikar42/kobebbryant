<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROI Calculator · Agent Lab</title>
  <meta name="description" content="Estimate how many hours and euros an AI agent could save your team each month, and the payback time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header data-site-header></header>

  <main>
    <section id="roi" class="section page-top">
      <h1>ROI calculator: what could an agent save you?</h1>
      <p>Fill in one repetitive task. The numbers update as you type.</p>

      <div class="roi">
        <form id="roi-form" class="roi-inputs" novalidate>
          <div class="field">
            <label for="roi-hours">Hours per week spent on the task (per employee)</label>
            <input id="roi-hours" type="number" min="0" step="0.5" inputmode="decimal">
          </div>
          <div class="field">
            <label for="roi-people">Number of employees doing it</label>
            <input id="roi-people" type="number" min="1" step="1" inputmode="numeric">
          </div>
          <div class="field">
            <label for="roi-rate">Hourly rate (€)</label>
            <input id="roi-rate" type="number" min="0" step="1" inputmode="decimal">
          </div>
          <div class="field">
            <label for="roi-share">Share an agent can take over: <strong><output id="roi-share-out">60%</output></strong></label>
            <input id="roi-share" type="range" min="30" max="80" step="5">
          </div>
        </form>

        <div class="roi-results" aria-live="polite">
          <div class="roi-stat"><span>Hours saved per month</span><strong id="roi-out-hours">–</strong></div>
          <div class="roi-stat"><span>Savings per month</span><strong id="roi-out-money">–</strong></div>
          <div class="roi-stat"><span>Payback vs. the Starter package</span><strong id="roi-out-payback">–</strong></div>
          <a id="roi-cta" class="btn primary" href="/?plan=scan#contact">Check this in a free intro call</a>
          <p class="fine-print">Estimates only, based on your input.</p>
        </div>
      </div>
    </section>
  </main>

  <footer data-site-footer></footer>

  <script src="/config.js"></script>
  <script src="/agents-data.js"></script>
  <script src="/layout.js"></script>
  <script src="/agents.js"></script>
  <script src="/sales.js"></script>
</body>
</html>
